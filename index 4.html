<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ຕິດຕາມການຜະລິດໄກ່</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f1eee7; --ink:#1d2a2c; --muted:#5f6b6d; --line:#e3ded3;
  --accent:#0f6b6b; --accent-ink:#ffffff; --accent-soft:#dff0ee;
  --warn:#b45309; --warn-soft:#fdecd2; --bad:#b42318; --bad-soft:#fde4e1; --ok:#1d7a46; --ok-soft:#dcf2e4;
  --c1:#0f6b6b; --c2:#d97706; --c3:#4f5fa8;
  --shadow:0 1px 2px rgba(30,40,40,.06),0 4px 14px rgba(30,40,40,.05);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121819; --surface:#1a2223; --surface2:#222c2d; --ink:#e8eeee; --muted:#9aa8a9; --line:#2d3a3b;
    --accent:#4fc1b8; --accent-ink:#062826; --accent-soft:#17403e;
    --warn:#f5b15a; --warn-soft:#41300f; --bad:#ff8a7d; --bad-soft:#431c18; --ok:#6fd49a; --ok-soft:#173a26;
    --c1:#4fc1b8; --c2:#f0a43a; --c3:#8e9bf0; --shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans Lao','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.side .nav,.side .tools{flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.side .spacer{flex:1}
.tools{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.tools button{display:flex;gap:9px;align-items:center;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px}
.tools button:hover{background:var(--surface2);color:var(--ink)}
.tools svg{width:17px;height:17px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1280px;width:100%}
.head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:24px;line-height:1.3}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px}
.btn.icon{padding:6px;border-radius:8px;border-color:transparent;background:none;color:var(--muted)}
.btn.icon:hover{background:var(--surface2);color:var(--ink)}
.btn.icon.del:hover{color:var(--bad);background:var(--bad-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .l{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.kpi .l i{width:9px;height:9px;border-radius:3px;display:inline-block}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .s{color:var(--muted);font-size:13px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.panel{padding:18px 20px}
.panel h2{margin:0 0 14px;font-size:16px}
.panel h2 small{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:none}
.alert.ok .dot{background:var(--ok)} .alert.warn .dot{background:var(--warn)} .alert.bad .dot{background:var(--bad)}
.alert b{display:block;font-size:14px}
.alert span{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}

/* bars */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar-row{display:grid;grid-template-columns:86px 1fr 92px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bar-row .t{color:var(--muted)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface2);gap:2px}
.stack span{display:block;min-width:2px}
.bar-row .n{text-align:right;font-weight:600}
.prog{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:80px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:5px}

/* tables */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:0;padding:9px 0;width:100%}
.search:focus-within{outline:2px solid var(--accent)}
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
thead th{background:var(--surface2);text-align:right;font-weight:600;font-size:12.5px;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.calc{background:color-mix(in srgb,var(--surface2) 55%,transparent);font-weight:600}
tfoot td{padding:12px;text-align:right;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
td.act{text-align:right;width:124px;white-space:nowrap}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;margin-left:6px}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.noresult{padding:36px;text-align:center;color:var(--muted)}
.hint-note{color:var(--muted);font-size:13px;margin-top:12px}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,20,.5)}
dialog form{padding:22px}
dialog h3{margin:0 0 16px;font-size:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field input:focus{outline:2px solid var(--accent);border-color:transparent}
.field .ev{font-size:12px;color:var(--accent);min-height:17px;font-variant-numeric:tabular-nums}
.field .ev.bad{color:var(--bad)}
.field .auto{font-size:11.5px;color:var(--muted)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20;gap:2px}
  .brand,.tools,.side .spacer{display:none}
  .nav{display:flex;width:100%;gap:2px;overflow-x:auto}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;text-align:center;justify-content:center;flex:1;min-width:56px}
  .nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  main{padding:18px 16px 96px}
  .grid2{grid-template-columns:1fr}
  .head h1{font-size:21px}
  .mtools{display:flex!important}
  .fields{grid-template-columns:1fr 1fr}
}
.mtools{display:none;gap:8px;margin-bottom:14px;flex-wrap:wrap}
@media (max-width:420px){.fields{grid-template-columns:1fr}.bar-row{grid-template-columns:70px 1fr 78px}}
@media print{
  .side,.toolbar,.head .btn,.mtools,td.act,th.act,.toast{display:none!important}
  .app{display:block} body{background:#fff;color:#000} main{padding:0}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div>
      <div><b>ຕິດຕາມການຜະລິດໄກ່</b><small>ລະລາຍ · ຜະລິດ · ສົ່ງ · ສະຕ໋ອກ</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="tools">
      <button id="bAddBranch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>ເພີ່ມສາຂາໃໝ່</button>
      <button id="bBackup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>ສຳຮອງຂໍ້ມູນ (JSON)</button>
      <button id="bRestore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v3h16v-3"/></svg>ກູ້ຄືນຂໍ້ມູນ</button>
      <button id="bPrint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>ພິມໜ້ານີ້</button>
      <button id="bReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>ຄືນຄ່າເລີ່ມຕົ້ນ</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=isoOf(new Date());
const parse=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{if(!iso)return '';const d=parse(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtDate=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:'';
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const gk=v=>fmtN(v)+' ກຣາມ ('+fmtN(v/1000)+' kg)';
const fmtN=v=>(v==null||isNaN(v))?'':nf.format(v);

/* ເຮັດວຽກກັບຕົວເລກ ແລະ ສູດ ເຊັ່ນ 13550+13400+13600 */
function ev(v){
  if(v===''||v==null)return null;
  if(typeof v==='number')return v;
  const s=String(v).replace(/,/g,'').trim().replace(/^=/,'');
  if(!s)return null;
  if(!/^[\d+\-*/().\s]+$/.test(s))return NaN;
  try{const r=Function('"use strict";return ('+s+')')();return Number.isFinite(r)?r:NaN}catch{return NaN}
}
const nz=v=>{const r=ev(v);return (r==null||isNaN(r))?0:r};

/* ============ data ============ */
const KEY='chicken-tracker-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){
  const r=o=>({id:uid(),...o});
  return {
    thaw:[
      r({date:'2026-10-23',boxes:'9',ready:'2026-10-26'}),
      r({date:'2026-10-27',boxes:'8',ready:'2026-10-30'}),
      r({date:'2026-10-30',boxes:'9',ready:'2026-11-02'}),
    ],
    prod:[
      r({batch:'2026-10-23',ferment:'2026-10-26',expiry:'2026-10-31',actual:'167460',big:'56000',jr:'5900',thigh:'111460'}),
      r({batch:'2026-10-26',ferment:'2026-10-30',expiry:'2026-11-05',actual:'94850',big:'39000',jr:'2900',thigh:''}),
    ],
    branches:[{id:'vx',name:'ວັງຊາຍ'},{id:'mg',name:'ເມກ້າ'}],
    vx:[
      r({date:'2026-10-27',made:'2026-10-26',expiry:'2026-10-31',tk:'13550+13400+13600',tb:'12+12+12',bk:'14000+14050',bb:'12+12',jk:'',jb:''}),
      r({date:'2026-10-30',made:'2026-10-30',expiry:'2026-11-05',tk:'',tb:'',bk:'',bb:'',jk:'',jb:''}),
    ],
    mg:[
      r({date:'2026-10-27',made:'2026-10-26',expiry:'2026-10-31',tk:'6800+13550+13450',tb:'12+12+6',bk:'14100+4750',bb:'12+12',jk:'1600',jb:'2'}),
    ],
    stock:[
      r({recv:'2026-10-27',item:'ໄກ່',qty:'50',old:'9',outDate:'2026-10-27',outQty:'8'}),
    ],
    po:[
      ['2777000100983','Black Latex Gloves size M 100','10','Pack'],
      ['8856959005984','Hairnets','5','Pack'],
      ['8859095901233','VD Face Mask 3-layer White','10','box'],
      ['8850304015161','Scotch Brite ScotchWash the dishes 2floor 3*5Inches','2','Pack'],
      ['885034077400','Rubber Gloves','10','Pack'],
      ['8850919001733','Apple Garbage Bag Roll Size 28x36','5','Pack'],
      ['2777000031911','ໄມ້ຖູກພື້ນ 10"','5','pcs'],
      ['8500000500954','So dium Ascorbate Non-acidic Vitamin C 100g','1','Unit'],
      ['8500000500918','ລານາ ແປ້ງໂຊດ້ຽມ ໄຕຟອສເຟດ 1ກິໂລ lana STPP Sodium Tripolyphospate 1kg','1','Unit'],
      ['850000050917','ລານາ ແປ້ງມັນໂມດິຟາຍ 1 ກິໂລ  Lana Modified Starch 1kg','1','Unit'],
      ['6010019','ກຣິນທີ ຜົງຖົ່ວເຫຼືອງ 250ກຣາມ Green tea Soy bean Powder 250g','1','Unit'],
      ['8851938900625','ແປງຂັດພື້ນດ້າມຢາງ','5','pcs'],
    ].map(a=>r({code:a[0],name:a[1],qty:a[2],unit:a[3]})),
    chick:[['2026011600043','frozen Chicken Boneless drum and boneless tigh 110-120 (packing:2kg xBags)','180','unit']].map(a=>r({code:a[0],name:a[1],qty:a[2],unit:a[3]})),
    eco:[['7101823','KLEENCARE 3.8LT','1','gal'],['204-300811','CLICK10 10LT','1','gal'],['7102212','NOVAKLENE 10 LT','1','gal'],['7106063','22 MULTIQUAT SANITIZER 2 LT','',''],['','Spray Bottles 16Oz','5','pcs'],['','pump bottle','2','pcs']].map(a=>r({code:a[0],name:a[1],qty:a[2],unit:a[3]})),
    chickHead:{company:"MOM'S TOUCH (VANGXAY)\nR&D Nong Bon Rangsit Kolao Head Office.",by:'Mr. Koung',tel:'20 52121261',branch:'R&D Nong Bon  Kolao Head Office.',date:'2026-11-03',need:'2026-11-06',note:''},
    ecoHead:{prNo:'MT-ECO003',prNo2:'',by:'MOM\'S TOUCH "R&D',date:'2026-06-08',need:'',requestor:'MR: MEEXAY',dest:'R&D',tel:'2052121261',purpose:''},
    poHead:{company:"MOM'S TOUCH (R&D NongBon)\nR&D Nong Bon Rangsit Kolao Head Office.",by:'Mr. Koung',tel:'20 52121261',branch:'ມັມທັສ R&D (ຫຼັງຕືກໂຄລາວ)',date:'2026-11-03',need:'2026-11-06',note:''},
  };
}
let mem=null;
const EMBED=null;
function load(){
  try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
  return mem||(EMBED?JSON.parse(JSON.stringify(EMBED)):null);
}
function fileToImg(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=200,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);const k=Math.min(S/im.width,S/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(S-w)/2,(S-h)/2,w,h);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>toast('ອ່ານຮູບບໍ່ໄດ້');im.src=fr.result};fr.readAsDataURL(file)}
function stampVer(){const v=document.getElementById('verStamp');if(!v)return;const t=state.savedAt?new Date(state.savedAt):null;
  v.textContent='ເວີຊັນ 13/11/2026 · v16 | ຂໍ້ມູນ: ຂອງແຫ້ງ '+state.dry.length+' ລາຍການ'+(t?' · ບັນທຶກລ່າສຸດ '+fmtDate(state.savedAt.slice(0,10))+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'')}
function sortAll(){
  if(typeof SECTIONS==='undefined'||typeof sectionsReady==='undefined'||!sectionsReady)return;
  Object.keys(SECTIONS).forEach(k=>{
    const f=(SECTIONS[k].fields||[]).find(x=>x.type==='date');if(!f||!Array.isArray(state[k]))return;
    const key=f.key;

  });

function syncDryCatalog(){
  if(!state.catalogs||!state.catalogs.po||!Array.isArray(state.dry))return;
  const cat=state.catalogs.po;
  state.dry.forEach(d=>{
    if(!d.name)return;
    let hit=cat.find(c=>c.did===d.id)||cat.find(c=>!c.did&&((d.code&&c.code===d.code)||c.name===d.name));
    if(hit){hit.did=d.id;hit.code=d.code||hit.code||'';hit.name=d.name;if(d.unit)hit.unit=d.unit}
    else cat.push({code:d.code||'',name:d.name,unit:d.unit||'',did:d.id});
  });
  /* ລຶບລາຍການໃນລາຍຊື່ທີ່ມາຈາກຂອງແຫ້ງ ແຕ່ຖືກລຶບອອກຈາກຂອງແຫ້ງແລ້ວ */
  state.catalogs.po=cat.filter(c=>!c.did||state.dry.some(d=>d.id===c.did));
}

function learnCatalog(sec,r){
  if(!r.name)return;
  const cat=state.catalogs[sec];
  const hit=cat.find(c=>(r.code&&c.code===r.code)||c.name===r.name);
  if(hit){if(!hit.code&&r.code)hit.code=r.code;if(r.unit)hit.unit=r.unit;if(r.img)hit.img=r.img}
  else cat.push({code:r.code||'',name:r.name,unit:r.unit||'',...(r.img?{img:r.img}:{})});
}
function normalize(){
  const sd=seed();
  ['thaw','prod','stock','fz','bthaw'].forEach(k=>state[k]=state[k]||[]);
  if(state.fzSeeded===1){state.fzSeeded=2;state.fz=state.fz.filter(r=>!(r.name==='Bulgogi patty'&&nz(r.qty)===0))}
  state.bthaw.forEach(r=>{if(r.fzDed&&!r.ingDed){const it=state.fz.find(x=>x.id===r.fzDed.id);r.ingDed=[{src:'fz',id:r.fzDed.id,q:r.fzDed.q}];r.ing=[{src:'fz',id:r.fzDed.id,g:String(Math.round(r.fzDed.q*(it?(nz(it.gper)||1000):1000))),name:it?it.name:''}];r.tot=String(Math.round(nz(r.tot)||nz(r.qty)));r.fzDed=null}})
  if(!state.fzSeeded)state.fzSeeded=2;
  if(!Array.isArray(state.branches)||!state.branches.length)state.branches=sd.branches;
  state.branches.forEach(b=>state[b.id]=state[b.id]||[]);
  state.sentOrders=state.sentOrders||{};
  if(state.seasonPct==null)state.seasonPct='1.5';
  syncDryCatalog();
  state.dryLog=state.dryLog||[];if(state.rptTitle==null)state.rptTitle='ໂຮງໝັກໄກ່';
  /* ຍ້າຍ "ເອົາອອກລະລາຍ" ເກົ່າໃນໜ້າຮັບເຄື່ອງ ໄປເປັນລາຍການໃນໜ້າລະລາຍ (ລິງກ໌ກັນ) */
  state.stock.forEach(r=>{
    if(nz(r.outQty)>0){
      const d=r.outDate||r.recv||'';
      if(!state.thaw.some(t=>t.date===d))state.thaw.push({id:uid(),date:d,boxes:String(nz(r.outQty)),ready:d?addDays(d,3):'',fromStock:'y'});
      r.outQty='';r.outDate='';
    }
  });
  state.thaw.sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:(a.date||'9')>(b.date||'9')?1:0);
  state.branches.forEach(b=>state[b.id].forEach(x=>{if(!x.batch&&x.expiry){const p=state.prod.find(p=>p.expiry===x.expiry);if(p)x.batch=p.id}}));
  state.big=state.big||[];
  state.chickOrders=state.chickOrders||[];
  if(state.chickFactor==null)state.chickFactor='1';
  if(state.labW==null)state.labW='58';if(state.labH==null)state.labH='48';if(!state.labV){state.labV=1;if(state.labW==='48'&&state.labH==='58'){state.labW='58';state.labH='48'}}if(state.btMode==null)state.btMode='tspl';if(state.btInvert==null)state.btInvert='';
  if(state.blockKg==null)state.blockKg='12';if(state.unitKg==null)state.unitKg='1';
  if(!Array.isArray(state.dry))state.dry=sd.po.map(r=>({id:uid(),code:r.code,name:r.name,unit:r.unit,qty:'',min:'',upd:''}));
  if(sectionsReady)syncBranches();
  ORDER_KEYS.forEach(k=>{if(!state[k])state[k]=sd[k];});
  ['poHead','chickHead','ecoHead'].forEach(h=>state[h]={...sd[h],...(state[h]||{})});
  state.catalogs=state.catalogs||{};
  if(!state.catalogs.po)state.catalogs.po=state.catalog||[];
  ORDER_KEYS.forEach(k=>{state.catalogs[k]=state.catalogs[k]||[];sd[k].forEach(r=>learnCatalog(k,r));state[k].forEach(r=>learnCatalog(k,r))});
}

async function uiDialog(msg,o){o=o||{};return new Promise(res=>{
  const d=document.createElement('dialog');
  d.style.cssText='border:0;border-radius:14px;padding:18px;width:min(92vw,420px);background:var(--surface,#fff);color:var(--ink,#111);box-shadow:0 10px 40px rgba(0,0,0,.35)';
  d.innerHTML='<div style="white-space:pre-wrap;line-height:1.5;margin-bottom:12px">'+esc(msg)+'</div>'+(o.input?'<input id="uiIn" value="'+esc(o.def||'')+'" style="width:100%;margin-bottom:12px">':'')+'<div style="display:flex;gap:8px;justify-content:flex-end">'+(o.okOnly?'':'<button type="button" class="btn" id="uiNo">ຍົກເລີກ</button>')+'<button type="button" class="btn primary" id="uiOk">ຕົກລົງ</button></div>';
  document.body.appendChild(d);
  const done=v=>{try{d.close()}catch(e){}d.remove();res(v)};
  d.querySelector('#uiOk').onclick=()=>done(o.input?d.querySelector('#uiIn').value:true);
  const no=d.querySelector('#uiNo');if(no)no.onclick=()=>done(o.input?null:false);
  d.addEventListener('cancel',e=>{e.preventDefault();done(o.input?null:false)});
  d.showModal();
  const i=d.querySelector('#uiIn');if(i){i.focus();i.select();i.addEventListener('keydown',e=>{if(e.key==='Enter')d.querySelector('#uiOk').click()})}
})}

/* ===== ລິງກ໌ ຜະລິດ ↔ ສົ່ງສາຂາ ===== */
function batchStats(r){
  const prod={tk:prodThigh(r),bk:nz(r.big),jk:nz(r.jr)},sent={tk:0,bk:0,jk:0};
  const perB=state.branches.map(b=>{const rows=state[b.id].filter(x=>x.batch===r.id);
    const o={b,tk:sum(rows,x=>nz(x.tk)),bk:sum(rows,x=>nz(x.bk)),jk:sum(rows,x=>nz(x.jk))};
    ['tk','bk','jk'].forEach(k=>sent[k]+=o[k]);o.total=o.tk+o.bk+o.jk;return o});
  const left={tk:prod.tk-sent.tk,bk:prod.bk-sent.bk,jk:prod.jk-sent.jk};
  return {prod,sent,left,perB,prodTotal:prod.tk+prod.bk+prod.jk,sentTotal:sent.tk+sent.bk+sent.jk,leftTotal:left.tk+left.bk+left.jk};
}
const PROD_LINES=[['tk','Thigh patty'],['bk','Big Boneless'],['jk','JR VX']];
function prodFlow(){
  if(!state.prod.length)return '';
  const tot={tk:0,bk:0,jk:0};state.prod.forEach(r=>{const st=batchStats(r);PROD_LINES.forEach(([k])=>tot[k]+=st.left[k])});
  const T=tot.tk+tot.bk+tot.jk;
  const kp=(l,v,c)=>`<div class="card kpi"><div class="l"><i style="background:var(${c})"></i>${l}</div><div class="v num" ${v<0?'style="color:var(--bad)"':''}>${fmtN(v)}<small>ກຣາມ</small></div><div class="s num">= ${fmtN(v/1000)} kg</div></div>`;
  const cards=[...state.prod].reverse().map(r=>{
    const st=batchStats(r),bn=state.branches;
    const rowsH=PROD_LINES.map(([k,n])=>`<tr><td class="l">${n}</td><td class="num">${fmtN(st.prod[k])}</td>${st.perB.map(o=>`<td class="num">${fmtN(o[k])}</td>`).join('')}<td class="num">${fmtN(st.sent[k])}</td><td class="num calc" style="${st.left[k]<0?'color:var(--bad)':''}">${fmtN(st.left[k])}</td></tr>`).join('');
    const pc=st.prodTotal>0?Math.min(100,st.sentTotal/st.prodTotal*100):0;
    return `<section class="card panel" style="margin-bottom:12px"><h2>ງວດ ${fmtDate(r.batch)}<small>ໝັກ ${fmtDate(r.ferment)} · ໝົດອາຍຸ ${fmtDate(r.expiry)}</small></h2>
      <div class="tablewrap"><table style="min-width:480px"><thead><tr><th class="l">ສິນຄ້າ (ກຣາມ)</th><th>ຜະລິດໄດ້</th>${bn.map(b=>`<th>ສົ່ງ${esc(b.name)}</th>`).join('')}<th>ສົ່ງແລ້ວລວມ</th><th>ຍັງເຫຼືອ</th></tr></thead>
      <tbody>${rowsH}</tbody><tfoot><tr><td class="l">ລວມ</td><td class="num">${fmtN(st.prodTotal)}</td>${st.perB.map(o=>`<td class="num">${fmtN(o.total)}</td>`).join('')}<td class="num">${fmtN(st.sentTotal)}</td><td class="num" ${st.leftTotal<0?'style="color:var(--bad)"':''}>${fmtN(st.leftTotal)}</td></tr></tfoot></table></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="prog" style="flex:1"><span style="width:${pc}%"></span></div><span class="num" style="font-size:12.5px;color:var(--muted)">ສົ່ງແລ້ວ ${pc.toFixed(0)}%</span></div></section>`}).join('');

}

/* ===== ສະຕ໋ອກນ້ອຍ (ໂຮງໝັກ): ຮັບເຂົ້າ − ລະລາຍ (ລິງກ໌ກັບໜ້າລະລາຍ) ===== */
function stockSorted(){return state.stock.map((r,i)=>({r,i})).sort((a,b)=>{const x=a.r.recv||'9999',y=b.r.recv||'9999';return x<y?-1:x>y?1:a.i-b.i})}
function trackStart(){const f=stockSorted()[0];return f&&f.r.recv?f.r.recv:''}
function stockOpening(){const f=stockSorted()[0];return f?nz(f.r.old):0}
function thawCounted(t){const ts=trackStart();return t.fromStock!=='n'&&(!ts||!t.date||t.date>=ts)}
function thawedBoxes(){return sum(state.thaw.filter(thawCounted),t=>nz(t.boxes))}
function stockReceived(){return sum(state.stock,r=>nz(r.qty))}
function stockOnHand(){return stockOpening()+stockReceived()-thawedBoxes()}
function stockBalanceAt(r){
  const so=stockSorted(),pos=so.findIndex(x=>x.r===r);
  const rec=sum(so.slice(0,pos+1),x=>nz(x.r.qty));
  const th=sum(state.thaw.filter(t=>thawCounted(t)&&(!t.date||!r.recv||t.date<=r.recv)),t=>nz(t.boxes));
  return stockOpening()+rec-th;
}
function stockLink(){
  const h=stockOnHand();
  const k=(l,v,u,s,c,bad)=>`<div class="card kpi"><div class="l"><i style="background:var(${c})"></i>${l}</div><div class="v num" ${bad?'style="color:var(--bad)"':''}>${fmtN(v)}<small>${u}</small></div><div class="s num">${s}</div></div>`;
  const moves=state.thaw.filter(thawCounted);
  return `<div class="kpis">
    ${k('ສະຕ໋ອກສາຂາຄົງເຫຼືອ',h,'ແກັດ/ກ່ອງ',`ເກົ່າ ${fmtN(stockOpening())} + ຮັບ ${fmtN(stockReceived())} − ລະລາຍ ${fmtN(thawedBoxes())}`,'--c2',h<0)}
    ${k('ຍ້າຍອອກໄປລະລາຍແລ້ວ',thawedBoxes(),'ກ່ອງ',`${moves.length} ຄັ້ງ · ດຶງຈາກໜ້າ "ລະລາຍ" ອັດຕະໂນມັດ`,'--c1')}
  </div>${h<0?'<p class="hint-note" style="margin:-6px 0 12px;color:var(--bad)">ຍອດຕິດລົບ — ລະລາຍຫຼາຍກວ່າທີ່ມີໃນສະຕ໋ອກ ກວດຈຳນວນຮັບເຂົ້າ ຫຼື ສະຕ໋ອກເກົ່າ</p>':''}`;
}
function stockMoves(){
  const moves=state.thaw.filter(thawCounted);
  if(!moves.length)return '';
  return `<div class="card panel" style="margin-bottom:14px"><h2>ຍ້າຍອອກໄປລະລາຍ<small>ດຶງຈາກໜ້າ "ລະລາຍ" ອັດຕະໂນມັດ — ບໍ່ຕ້ອງກອກຊ້ຳ</small></h2>${moves.map(t=>`<div class="row" style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)"><span>${fmtDate(t.date)}</span><b class="num">− ${fmtN(nz(t.boxes))} ກ່ອງ</b></div>`).join('')}</div>`;

const sum=(arr,f)=>arr.reduce((a,r)=>a+f(r),0);
function dashboard(){
  const th=state.thaw, pr=state.prod;
  const boxes=sum(th,r=>nz(r.boxes)), bags=boxes*6, kgT=boxes*12;
  const prodKg=sum(pr,prodTotal);
  const allDel=state.branches.flatMap(b=>state[b.id]);const dKg=sum(allDel,delCalc.kg), dBags=sum(allDel,delCalc.bags);
  const onH=stockOnHand(),hasStock=state.stock.length>0;

  const prodTot={thigh:sum(pr,prodThigh),big:sum(pr,r=>nz(r.big)),jr:sum(pr,r=>nz(r.jr))};
  const del=(k)=>Object.fromEntries(state.branches.map(b=>[b.id,sum(state[b.id],r=>nz(r[k]))]));
  const rows=[
    ['Thigh patty',prodTot.thigh,del('tk'),'--c1'],
    ['Big Boneless',prodTot.big,del('bk'),'--c2'],
    ['JR VX',prodTot.jr,del('jk'),'--c3'],
  ];

  /* alerts (ລະອຽດ) */
  const al=[];
  const when=d=>d===0?'ມື້ນີ້':d>0?'ອີກ '+d+' ວັນ':(-d)+' ວັນກ່ອນ';
  th.forEach(r=>{
    if(!r.ready)return;const d=diffDays(r.ready,TODAY);
    const info=`${fmtN(ev(r.boxes))} ກ່ອງ · ${fmtN(thawCalc.bags(r))} ຖົງ · ${fmtN(thawCalc.kg(r))} ກິໂລ`;
    const lines=[info,`ລະລາຍວັນທີ່ ${fmtDate(r.date)} → ພ້ອມໃຊ້ ${fmtDate(r.ready)}`];
    if(d===0)al.push({lv:'ok',t:`ໄກ່ງວດລະລາຍ ${fmtDate(r.date)} ພ້ອມໃຊ້ມື້ນີ້`,lines,o:0,go:'thaw',tag:'ລະລາຍ'});
    else if(d>0&&d<=3)al.push({lv:'warn',t:`ໄກ່ງວດລະລາຍ ${fmtDate(r.date)} ພ້ອມໃຊ້ອີກ ${d} ວັນ`,lines,o:10+d,go:'thaw',tag:'ລະລາຍ'});
    else if(d<0&&d>=-3)al.push({lv:'ok',t:`ໄກ່ງວດລະລາຍ ${fmtDate(r.date)} ພ້ອມໃຊ້ແລ້ວ (${-d} ວັນກ່ອນ)`,lines,o:30-d,go:'thaw',tag:'ລະລາຍ'});
  });
  const allSent=b=>state[b.id];
  pr.forEach(r=>{
    if(!r.expiry)return;const d=diffDays(r.expiry,TODAY);if(d>3)return;
    const per=state.branches.map(b=>({n:b.name,kg:sum(state[b.id].filter(x=>x.batch===r.id),delCalc.kg)}));
    const sent=per.reduce((a,x)=>a+x.kg,0),made=prodTotal(r),left=made-sent;
    if(left<=0&&d>=0)return;          /* ສົ່ງໝົດແລ້ວ */
    if(d<0&&left<=0)return;
    const lines=[`ຜະລິດ ${gk(made)} (Thigh ${fmtN(prodThigh(r))} · Big bones ${fmtN(nz(r.big))} · JR ${fmtN(nz(r.jr))})`,
      `ສົ່ງແລ້ວ ${gk(sent)}`+(sent?' ('+per.filter(x=>x.kg).map(x=>x.n+' '+fmtN(x.kg)).join(' · ')+')':''),
      `ຍັງບໍ່ໄດ້ສົ່ງ ≈ ${gk(left)} · ໝົດອາຍຸ ${fmtDate(r.expiry)}`];
    al.push({lv:d<=1?'bad':'warn',t:d<0?`ງວດຜະລິດ ${fmtDate(r.batch)} ໝົດອາຍຸແລ້ວ ${-d} ວັນ — ຍັງເຫຼືອ ${gk(left)}`:`ງວດຜະລິດ ${fmtDate(r.batch)} ໝົດອາຍຸ${d===0?'ມື້ນີ້':'ອີກ '+d+' ວັນ'}`,lines,o:d<0?-10+d:d,go:'prod',tag:'ຜະລິດ'});
  });
  state.branches.forEach(b=>state[b.id].forEach(r=>{
    if(!r.expiry||delCalc.kg(r)<=0)return;const d=diffDays(r.expiry,TODAY);if(d<0||d>3)return;

  }));

  Object.keys(SCHED).forEach(k=>{
    const n=nextDue(k);if(!n||n.i>2)return;const S=SCHED[k];
    al.push({lv:n.i===0?'bad':n.i===1?'warn':'ok',
      t:n.i===0?`ມື້ນີ້ (${n.day}) ຕ້ອງ${S.name}`:`ອີກ ${n.i} ວັນ (${n.day} ${fmtDate(n.iso)}) ຕ້ອງ${S.name}`,
      lines:[`ກຳນົດ${S.rule}`,k==='chick'?(hasStock?`ສະຕ໋ອກໄກ່ດິບເຫຼືອ ${fmtN(onH)} ແກັດ (ຮັບເຂົ້າ − ລະລາຍ)`:'ຍັງບໍ່ມີຂໍ້ມູນສະຕ໋ອກ'):`ລາຍການໃນໃບສັ່ງ ${state.po.length} ລາຍການ`,'ກົດເພື່ອໄປໜ້າສັ່ງ ແລ້ວກົດ "ສົ່ງແລ້ວ ✓" ເມື່ອສົ່ງຄົບ'],
      o:n.i-3,go:k,tag:k==='chick'?'ເຕີມໄກ່':'ສັ່ງເຄື່ອງ'});
  });
  if(bigLeft()<0)al.push({lv:'warn',t:`ສະຕ໋ອກໃຫຍ່ຕິດລົບ ${fmtN(bigLeft())} kg`,lines:[`ຮັບເຂົ້າ ${fmtN(bigIn())} kg ແຕ່ສັ່ງເຕີມໄກ່ໄປ ${fmtN(bigOut())} kg`,'ກວດ/ເພີ່ມຍອດຮັບເຂົ້າສະຕ໋ອກໃຫຍ່ ຫຼື ກວດນ້ຳໜັກຕໍ່ຢູນິດ/ແກັດໃນໜ້າ "ເຕີມໄກ່"'],o:-3,go:'big',tag:'ສະຕ໋ອກໃຫຍ່'});
  const low=state.dry.filter(r=>dryLow(r)>0).sort((a,b)=>dryLow(b)-dryLow(a));
  if(low.length)al.push({lv:low.some(r=>dryLow(r)===2)?'bad':'warn',t:`ຂອງແຫ້ງໃກ້ໝົດ / ໝົດ ${low.length} ລາຍການ`,
    lines:low.slice(0,6).map(r=>`${r.name} — ເຫຼືອ ${fmtN(nz(r.qty))} ${r.unit||''} (ຂັ້ນຕ່ຳ ${fmtN(nz(r.min))})`).concat(low.length>6?['… ແລະ ອີກ '+(low.length-6)+' ລາຍການ']:[]),o:-2,go:'dry',tag:'ຂອງແຫ້ງ'});
  const lowF=(state.fz||[]).filter(r=>dryLow(r)>0).sort((a,b)=>dryLow(b)-dryLow(a));
  if(lowF.length)al.push({lv:lowF.some(r=>dryLow(r)===2)?'bad':'warn',t:`ຂອງແຊ່ແຂງໃກ້ໝົດ / ໝົດ ${lowF.length} ລາຍການ`,
    lines:lowF.slice(0,6).map(r=>`${r.name} — ເຫຼືອ ${fmtN(nz(r.qty))} ${r.unit||''} (ຂັ້ນຕ່ຳ ${fmtN(nz(r.min))})`),o:-2,go:'fz',tag:'ຂອງແຊ່ແຂງ'});
  if(pattyLeft()<0)al.push({lv:'warn',t:`Bulgogi patty ຕິດລົບ ${fmtN(pattyLeft())} ຊິ້ນ`,lines:['ເບີກໃຫ້ສາຂາຫຼາຍກວ່າຍອດທີ່ໃສ່ໄວ້ — ກວດຍອດ "ໄດ້ຈິງ" ໃນໜ້າສະຕ໋ອກໃຫຍ່'],o:-1,go:'big',tag:'Bulgogi'});
  const expL=[...(state.dry||[]).map(r=>({r,k:'ຂອງແຫ້ງ'})),...(state.fz||[]).map(r=>({r,k:'ແຊ່ແຂງ'}))].filter(x=>{const d=expDays(x.r);return d!=null&&d<=30&&nz(x.r.qty)>0}).sort((a,b)=>expDays(a.r)-expDays(b.r));
  if(expL.length)al.push({lv:expL.some(x=>expDays(x.r)<0)?'bad':'warn',t:`ໃກ້ໝົດອາຍຸ / ໝົດອາຍຸ ${expL.length} ລາຍການ`,lines:expL.slice(0,6).map(x=>{const d=expDays(x.r);return `${x.r.name} (${x.k}) — ${d<0?'ໝົດອາຍຸແລ້ວ '+(-d)+' ວັນ':'ອີກ '+d+' ວັນ'} (${fmtDate(x.r.exp)})`}),o:-3,go:'dry',tag:'ໝົດອາຍຸ'});
  al.sort((a,b)=>a.o-b.o);
  const nBad=al.filter(a=>a.lv==='bad').length;

  const maxBatch=Math.max(1,...pr.map(prodTotal));
  const bars=pr.length?pr.map(r=>{
    const t=prodThigh(r),b=nz(r.big),j=nz(r.jr),tot=Math.max(prodTotal(r),t+b+j);
    const w=x=>(x/maxBatch*100).toFixed(2)+'%';
    return `<div class="bar-row"><span class="t">${fmtDate(r.batch).slice(0,5)}</span><div class="stack" title="Thigh ${fmtN(t)} · Big bones ${fmtN(b)} · JR ${fmtN(j)}"><span style="width:${w(t)};background:var(--c1)"></span><span style="width:${w(b)};background:var(--c2)"></span><span style="width:${w(j)};background:var(--c3)"></span></div><span class="n num">${fmtN(tot)} <small style="font-weight:400;color:var(--muted)">g</small></span></div>`;
  }).join(''):'<div class="empty">ຍັງບໍ່ມີຂໍ້ມູນການຜະລິດ</div>';

  return `
  <div class="head"><div><h1>ພາບລວມ</h1><p>ສະຫຼຸບຂໍ້ມູນທັງໝົດ ນັບເຖິງວັນທີ່ ${fmtDate(TODAY)}</p></div><button class="btn" id="printBtn">🖨 ພິມໜ້ານີ້</button></div>

  <div class="kpis">
    <div class="card kpi"><div class="l"><i style="background:var(--c1)"></i>ໄກ່ລະລາຍທັງໝົດ</div><div class="v num">${fmtN(boxes)}<small>ກ່ອງ</small></div><div class="s num">${fmtN(bags)} ຖົງ · ${fmtN(kgT)} ກິໂລ</div></div>
    <div class="card kpi"><div class="l"><i style="background:var(--c2)"></i>ຜະລິດໄດ້ທັງໝົດ</div><div class="v num">${fmtN(prodKg)}<small>ກຣາມ</small></div><div class="s num">= ${fmtN(prodKg/1000)} kg · ${pr.length} ງວດ</div></div>
    <div class="card kpi"><div class="l"><i style="background:var(--c3)"></i>ສົ່ງອອກທັງໝົດ</div><div class="v num">${fmtN(dKg)}<small>ກຣາມ</small></div><div class="s num">= ${fmtN(dKg/1000)} kg · ${fmtN(dBags)} ຖົງ · ${state.branches.map(b=>esc(b.name)).join(' + ')}</div></div>
    <div class="card kpi" data-go="big" style="cursor:pointer"><div class="l"><i style="background:var(--c1)"></i>ສະຕ໋ອກໃຫຍ່ (ສູນກາງ)</div><div class="v num" ${bigLeft()<0?'style="color:var(--bad)"':''}>${fmtN(toBlocks(bigLeft()))}<small>ແກັດ</small></div><div class="s num">= ${fmtN(bigLeft())} kg · ຮັບເຂົ້າ ${fmtN(bigIn())} − ສັ່ງເຕີມໄກ່ ${fmtN(bigOut())} kg</div></div>
    <div class="card kpi"><div class="l"><i style="background:var(--ok)"></i>ສະຕ໋ອກນ້ອຍ (ໂຮງໝັກ) ເຫຼືອ</div><div class="v num" ${onH<0?'style="color:var(--bad)"':''}>${hasStock?fmtN(onH):'–'}<small>ແກັດ</small></div><div class="s num">${hasStock?`ເກົ່າ ${fmtN(stockOpening())} + ຮັບ ${fmtN(stockReceived())} − ລະລາຍ ${fmtN(thawedBoxes())}`:'ຍັງບໍ່ມີຂໍ້ມູນ'}</div></div>
  </div>
  <div class="grid2">
    <section class="card panel"><h2>ແຈ້ງເຕືອນ</h2>
      ${al.length?`<p class="hint-note" style="margin:-6px 0 10px">ທັງໝົດ ${al.length} ລາຍການ${nBad?` · <b style="color:var(--bad)">ດ່ວນ ${nBad}</b>`:''} — ກົດເພື່ອເປີດໜ້າທີ່ກ່ຽວຂ້ອງ</p><div class="alerts">${al.map(a=>`<div class="alert ${a.lv}" data-go="${a.go}" style="cursor:pointer"><i class="dot"></i><div style="flex:1;min-width:0"><b>${esc(a.t)}</b>${a.lines.map(l=>`<span style="display:block">${esc(l)}</span>`).join('')}</div><em style="font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap">${esc(a.tag)} ›</em></div>`).join('')}</div>`:'<div class="empty">ບໍ່ມີລາຍການທີ່ຕ້ອງຕິດຕາມໃນຕອນນີ້ 👍</div>'}
    </section>
    <section class="card panel"><h2>ຜະລິດແຍກຕາມງວດ<small>ກຣາມ</small></h2>
      <div class="legend"><span><i style="background:var(--c1)"></i>Thigh patty</span><span><i style="background:var(--c2)"></i>Big bones</span><span><i style="background:var(--c3)"></i>JR</span></div>
      ${bars}
    </section>
  </div>
  <section class="card panel"><h2>ຍອດຄົງເຫຼືອຂອງສິນຄ້າ<small>ຜະລິດ − ສົ່ງອອກ (ກຣາມ)</small></h2>
    <div class="tablewrap"><table>
      <thead><tr><th class="l">ສິນຄ້າ</th><th>ຜະລິດໄດ້</th>${state.branches.map(b=>`<th>ສົ່ງ${esc(b.name)}</th>`).join('')}<th>ຄົງເຫຼືອ</th><th class="l">ສົ່ງອອກແລ້ວ</th></tr></thead>
      <tbody>${rows.map(([n,p,d,c])=>{const out=state.branches.reduce((a,b)=>a+d[b.id],0),left=p-out,pc=p>0?Math.min(100,out/p*100):0;
        return `<tr><td class="l"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(${c});margin-right:8px"></i>${n}</td><td class="num">${fmtN(p)}</td>${state.branches.map(b=>`<td class="num">${fmtN(d[b.id])}</td>`).join('')}<td class="num calc" style="${left<0?'color:var(--bad)':''}">${fmtN(left)}</td><td class="l" style="min-width:150px"><div style="display:flex;align-items:center;gap:8px"><div class="prog" style="flex:1"><span style="width:${pc}%;background:var(${c})"></span></div><span class="num" style="font-size:12.5px;color:var(--muted);width:38px">${pc.toFixed(0)}%</span></div></td></tr>`}).join('')}</tbody>
    </table></div>
    <p class="hint-note">ຄົງເຫຼືອ = ຍອດທີ່ຜະລິດໄດ້ ລົບ ຍອດທີ່ສົ່ງອອກທັງສອງບ່ອນ (ຄິດລວມທຸກງວດ)</p>
  </section>`;
}

/* ============ table view ============ */
function rowText(sec,r){
  const S=SECTIONS[sec];
  return S.cols.map(c=>(c.text?c.text(r):String(c.get(r)).replace(/<[^>]*>/g,''))).join(' ').toLowerCase();
}
function tableView(sec){
  const S=SECTIONS[sec];
  const all=state[sec];
  const q=query.trim().toLowerCase();
  const list=all.map((r,i)=>({r,i})).filter(x=>!q||rowText(sec,x.r).includes(q));
  const hasSum=S.cols.some(c=>c.sum);
  const body=list.map(({r,i})=>`<tr>
    <td class="l num" style="color:var(--muted)">${i+1}</td>
    ${S.cols.map(c=>`<td class="num ${c.l?'l':''} ${c.calc?'calc':''}">${c.get(r)}</td>`).join('')}
    <td class="act">${S.branch?`<button class="btn icon" data-slip="${r.id}" aria-label="ພິມໃບສົ່ງ" title="ພິມໃບສົ່ງ (ເຄື່ອງພິມນ້ອຍ)">🖨</button><button class="btn icon" data-btslip="${r.id}" aria-label="ພິມຜ່ານບລູທູດ" title="ພິມຜ່ານບລູທູດ (ເຄື່ອງພິມນ້ອຍ)">🔵</button><button class="btn icon" data-pngslip="${r.id}" aria-label="ບັນທຶກເປັນຮູບ" title="ບັນທຶກ/ແຊຣ໌ເປັນຮູບ ເພື່ອສົ່ງເຂົ້າແອັບຂອງເຄື່ອງພິມ">🖼</button>`:''}<button class="btn icon" data-edit="${r.id}" aria-label="ແກ້ໄຂ" title="ແກ້ໄຂ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="btn icon del" data-del="${r.id}" aria-label="ລຶບ" title="ລຶບ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></td></tr>`).join('');
  const foot=hasSum?`<tfoot><tr><td class="l">ລວມ</td>${S.cols.map((c,ci)=>`<td class="num ${c.l?'l':''}">${c.sum?fmtN(sum(all,c.sum)):''}</td>`).join('')}<td></td></tr></tfoot>`:'';
  return `
  <div class="head"><div><h1>${S.title}</h1><p>${S.sub}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="printBtn">🖨 ພິມໜ້ານີ້</button>${S.branch?'<button class="btn" id="renBtn">✎ ປ່ຽນຊື່ສາຂາ</button><button class="btn" id="delBranchBtn">ລຶບສາຂາ</button>':''}${ORDERS[sec]?'<button class="btn primary" id="xlsBtn" style="background:var(--ok);border-color:var(--ok);color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>ດາວໂຫຼດ Excel</button>':''}<button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>ເພີ່ມ${S.item}</button></div></div>
  <div class="mtools" style="display:none">${mobileTools()}</div>
  ${S.extra?S.extra():''}
  ${ORDERS[sec]?schedBanner(sec)+orderHeader(sec):''}${sec==='dry'?schedBanner('po'):''}
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="ຄົ້ນຫາ (ວັນທີ່, ຕົວເລກ...)" value="${esc(query)}"></label>
    ${ORDERS[sec]?'':`<button class="btn" id="csvBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>ດາວໂຫຼດ CSV</button>`}
  </div>
  <div class="card tablewrap">
    ${all.length?`<table><thead><tr><th class="l">ລຳດັບ</th>${S.cols.map(c=>`<th class="${c.l?'l':''}">${c.label}</th>`).join('')}<th class="act"></th></tr></thead><tbody>${body}</tbody>${foot}</table>${list.length?'':'<div class="noresult">ບໍ່ພົບລາຍການທີ່ຄົ້ນຫາ</div>'}`
    :`<div class="noresult">ຍັງບໍ່ມີຂໍ້ມູນ — ກົດ “ເພີ່ມ${S.item}” ເພື່ອເລີ່ມບັນທຶກ</div>`}
  </div>
  <p class="hint-note">ຊ່ອງສີເທົາແມ່ນຄ່າທີ່ລະບົບຄິດໃຫ້ອັດຕະໂນມັດ. ຂໍ້ມູນຖືກເກັບໄວ້ໃນເບຣົາເຊີນີ້ — ກົດ “ສຳຮອງຂໍ້ມູນ” ເປັນປະຈຳເພື່ອຄວາມປອດໄພ.</p>`;
}
function mobileTools(){
  return `<button class="btn" data-m="addbranch">+ ສາຂາ</button><button class="btn" data-m="backup">ສຳຮອງຂໍ້ມູນ</button><button class="btn" data-m="restore">ກູ້ຄືນ</button><button class="btn" data-m="print">ພິມ</button>`;
}

function render(){
  renderNav();
  syncDryCatalog();sortAll();stampVer();
  const m=$('#main');
  m.innerHTML=view==='home'?dashboard():view==='report'?reportView():tableView(view);
  bindMain();
}
function bindMain(){
  const m=$('#main');
  $('#addBtn')?.addEventListener('click',()=>openForm(view));
  const q=$('#q');
  if(q){q.addEventListener('input',()=>{query=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)})}
  m.querySelectorAll('[data-ph]').forEach(i=>i.addEventListener('input',()=>{state[ORDERS[view].head][i.dataset.ph]=i.value;save()}));
  m.querySelectorAll('[data-go]').forEach(e=>e.addEventListener('click',()=>go(e.dataset.go)));
  m.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',async()=>{
    const r=state.dry.find(x=>x.id===b.dataset.adj),d=+b.dataset.d;
    const v=ev(await uiPrompt((d>0?'ຮັບເຂົ້າ':'ເບີກໃຊ້')+' "'+r.name+'" ຈຳນວນເທົ່າໃດ? ('+(r.unit||'')+')','1'));
    if(v==null||isNaN(v)||v<=0)return;
    r.qty=String(Math.round((nz(r.qty)+d*v)*1000)/1000);r.upd=TODAY;state.dryLog.push({id:uid(),date:TODAY,item:r.id,name:r.name,unit:r.unit||'',d:d*v});save();render();toast((d>0?'ຮັບເຂົ້າ':'ເບີກໃຊ້')+' '+fmtN(v)+' ແລ້ວ ✓');
  }));
  m.querySelectorAll('[data-fadj]').forEach(b=>b.addEventListener('click',async()=>{
    const r=state.fz.find(x=>x.id===b.dataset.fadj),d=+b.dataset.d;
    const v=ev(await uiPrompt((d>0?'ຮັບເຂົ້າ':'ເບີກໃຊ້')+' "'+r.name+'" ຈຳນວນເທົ່າໃດ? ('+(r.unit||'')+')','1'));
    if(v==null||isNaN(v)||v<=0)return;
    r.qty=String(Math.round((nz(r.qty)+d*v)*1000)/1000);r.upd=TODAY;save();render();toast((d>0?'ຮັບເຂົ້າ':'ເບີກໃຊ້')+' '+fmtN(v)+' ແລ້ວ ✓');
  }));
  m.querySelectorAll('[data-pset]').forEach(b=>b.addEventListener('click',async()=>{
    const r=state.bthaw.find(x=>x.id===b.dataset.pset);
    const v=ev(await uiPrompt('ຈຳນວນ Bulgogi patty ທີ່ເຮັດໄດ້ຈິງ (ຊິ້ນ) — ຄາດໄດ້ '+fmtN(nz(r.est)),r.patty||r.est||''));
    if(v==null||isNaN(v)||v<0)return;
    r.patty=String(v);save();render();toast('ບັນທຶກຍອດຈິງແລ້ວ ✓');
  }));
  m.querySelectorAll('[data-fset]').forEach(b=>b.addEventListener('click',async()=>{
    const r=state.fz.find(x=>x.id===b.dataset.fset);

  const from=(await uiPrompt('ຕັດສະຕ໋ອກຍ້ອນຫຼັງ ສຳລັບການສົ່ງທີ່ຍັງບໍ່ໄດ້ຕັດ ຕັ້ງແຕ່ວັນທີ່ (ປີ-ເດືອນ-ວັນ):',TODAY)||'').trim();if(!from)return;
  const todo=[];state.branches.forEach(b=>state[b.id].forEach(r=>{if((r.date||'')>=from&&((nz(r.ctn)>0&&!r.cDed&&boxItem())||(delCalc.bags(r)>0&&!r.bgDed&&bagItem())))todo.push(r)}));
  if(!todo.length){toast('ບໍ່ມີລາຍການທີ່ຕ້ອງຕັດ');return}

function printSlip(sec,id){
  const html=slipHtml(sec,id);if(!html){toast('ບໍ່ພົບລາຍການ');return}
  const old=document.getElementById('slipFrame');if(old)old.remove();
  const f=document.createElement('iframe');f.id='slipFrame';
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  f.srcdoc=html;
  f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('ພິມບໍ່ໄດ້ — ກວດເຄື່ອງພິມ')}},250)};
}
/* ===== ດາວໂຫຼດໃບສັ່ງເຄື່ອງເປັນ Excel (.xlsx ສ້າງໃນແອັບ ບໍ່ຕ້ອງໃຊ້ອິນເຕີເນັດ) ===== */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=~0;for(const x of b)c=t[(c^x)&255]^(c>>>8);return ~c>>>0}})();
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  for(const [name,text] of files){
    const nb=enc.encode(name),db=typeof text==='string'?enc.encode(text):text,crc=CRC(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length;
  }
  const cs=cen.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function exportCSV(sec){
  const S=SECTIONS[sec];
  const plain=(c,r)=>c.text?c.text(r):String(c.get(r)).replace(/<[^>]*>/g,'').replace(/,/g,'');
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[['ລຳດັບ',...S.cols.map(c=>c.label)].map(q).join(',')];
  state[sec].forEach((r,i)=>lines.push([i+1,...S.cols.map(c=>plain(c,r))].map(q).join(',')));
  download(`${sec}-${TODAY}.csv`,'﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
